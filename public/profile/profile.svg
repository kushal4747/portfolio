<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <radialGradient id="portalGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#223344" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#121820" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0A0C0E" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(215, 226, 234, 0.4)" />
      <stop offset="50%" stop-color="rgba(100, 105, 115, 0.2)" />
      <stop offset="100%" stop-color="rgba(215, 226, 234, 0.05)" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BBCCD7" />
      <stop offset="100%" stop-color="#646973" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" rx="36" fill="url(#portalGlow)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Geometric Tech Grid -->
  <g stroke="rgba(215, 226, 234, 0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="750" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="500" y1="0" x2="500" y2="750" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="400" x2="600" y2="400" />
    <line x1="0" y1="600" x2="600" y2="600" />
  </g>

  <!-- Outer Ring Orbit -->
  <circle cx="300" cy="320" r="160" fill="none" stroke="rgba(215, 226, 234, 0.12)" stroke-width="1.5" stroke-dasharray="8 8" />
  <circle cx="300" cy="320" r="130" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(215, 226, 234, 0.25)" stroke-width="2" />

  <!-- Tech Silhouette / Developer Avatar Motif -->
  <!-- Head & Shoulders outline -->
  <path d="M 230 460 C 230 390, 370 390, 370 460 Z" fill="rgba(215, 226, 234, 0.1)" stroke="rgba(215, 226, 234, 0.3)" stroke-width="2" />
  <circle cx="300" cy="320" r="54" fill="rgba(215, 226, 234, 0.15)" stroke="rgba(215, 226, 234, 0.35)" stroke-width="2" />

  <!-- Code brackets floating beside avatar -->
  <text x="170" y="335" fill="rgba(215, 226, 234, 0.4)" font-family="monospace" font-size="38" font-weight="700">&lt;</text>
  <text x="405" y="335" fill="rgba(215, 226, 234, 0.4)" font-family="monospace" font-size="38" font-weight="700">/&gt;</text>

  <!-- Monogram Initials -->
  <text x="300" y="332" text-anchor="middle" fill="#D7E2EA" font-family="'Kanit', sans-serif" font-size="28" font-weight="700" letter-spacing="2">VS</text>

  <!-- Title & Status -->
  <text x="300" y="540" text-anchor="middle" fill="url(#textGrad)" font-family="'Kanit', sans-serif" font-size="22" font-weight="700" letter-spacing="3">VISHWAJEET KUMAR SAHU</text>
  <text x="300" y="570" text-anchor="middle" fill="#8F9CA7" font-family="system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="1">CSE STUDENT • SVIET CHANDIGARH</text>

  <!-- Badge at bottom -->
  <g transform="translate(150, 620)">
    <rect width="300" height="42" rx="21" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="28" cy="21" r="5" fill="#10B981" />
    <text x="44" y="26" fill="#D7E2EA" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Ready for /public/profile/profile.png</text>
  </g>
</svg>
