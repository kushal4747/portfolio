<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1217" />
      <stop offset="100%" stop-color="#050709" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="900" y1="0" x2="900" y2="800" />
  </g>

  <!-- Central Glow -->
  <circle cx="600" cy="400" r="280" fill="#10B981" opacity="0.08" filter="blur(60px)" />

  <!-- Main Card Simulation -->
  <rect x="180" y="140" width="840" height="520" rx="24" fill="url(#cardGlow)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect x="220" y="180" width="760" height="50" rx="10" fill="rgba(255,255,255,0.04)" />
  <circle cx="250" cy="205" r="6" fill="#EF4444" opacity="0.8" />
  <circle cx="270" cy="205" r="6" fill="#F59E0B" opacity="0.8" />
  <circle cx="290" cy="205" r="6" fill="#10B981" opacity="0.8" />
  <text x="320" y="211" fill="#8F9CA7" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1">VYORA SYSTEM · FOOD WASTE INTELLIGENCE PLATFORM</text>

  <!-- Metrics Grid -->
  <!-- Box 1: Spoilage -->
  <rect x="220" y="260" width="235" height="150" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
  <text x="245" y="295" fill="#8F9CA7" font-family="system-ui, sans-serif" font-size="13">SPOILAGE INDEX</text>
  <text x="245" y="340" fill="#10B981" font-family="system-ui, sans-serif" font-size="34" font-weight="700">-28.4%</text>
  <text x="245" y="375" fill="#5F6B76" font-family="system-ui, sans-serif" font-size="12">AI predictive threshold active</text>

  <!-- Box 2: Overproduction -->
  <rect x="480" y="260" width="235" height="150" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
  <text x="505" y="295" fill="#8F9CA7" font-family="system-ui, sans-serif" font-size="13">OVERPRODUCTION RISK</text>
  <text x="505" y="340" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="34" font-weight="700">OPTIMAL</text>
  <text x="505" y="375" fill="#5F6B76" font-family="system-ui, sans-serif" font-size="12">Batch size dynamically adjusted</text>

  <!-- Box 3: Plate Waste -->
  <rect x="740" y="260" width="240" height="150" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" />
  <text x="765" y="295" fill="#8F9CA7" font-family="system-ui, sans-serif" font-size="13">REDUCTION TRAJECTORY</text>
  <text x="765" y="340" fill="#FBBF24" font-family="system-ui, sans-serif" font-size="34" font-weight="700">94.2%</text>
  <text x="765" y="375" fill="#5F6B76" font-family="system-ui, sans-serif" font-size="12">Audit benchmark compliance</text>

  <!-- Graph simulation -->
  <path d="M 230 570 Q 350 490, 480 520 T 730 450 T 970 420" fill="none" stroke="url(#neonGreen)" stroke-width="4" stroke-linecap="round" />
  <path d="M 230 570 Q 350 490, 480 520 T 730 450 T 970 420 L 970 600 L 230 600 Z" fill="url(#neonGreen)" opacity="0.08" />

  <!-- Footnote -->
  <text x="600" y="630" text-anchor="middle" fill="#5F6B76" font-family="system-ui, sans-serif" font-size="13" letter-spacing="2">TRACK · UNDERSTAND · ACT · REDUCE</text>
</svg>
